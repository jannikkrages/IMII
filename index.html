<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chroma — Color Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>

    <div class="app">

        <header>
            <h1>chroma</h1>
            <p class="tagline">color conversion & scheme generator</p>
        </header>

        <!-- COLOR PREVIEW -->
        <div class="color-preview-card" id="previewCard">
            <div class="lottie-swatch" id="lottieSwatch"></div>
            <div class="color-swatch" id="colorSwatch"></div>
            <div class="color-name" id="colorName">Pick a color to start</div>
        </div>

        <!-- CONVERTER SECTION -->
        <section class="section">
            <h2 class="section-title">Convert</h2>

            <!-- HEX TO RGB -->
            <div class="card">
                <label class="label">HEX → RGB</label>
                <div class="input-row">
                    <input
                        type="text"
                        id="hexInput"
                        class="input"
                        placeholder="#1a2b3c"
                        maxlength="7"
                    />
                    <button class="btn" id="hexBtn">Convert</button>
                </div>
                <div class="result" id="hexResult"></div>
            </div>

            <!-- RGB TO HEX -->
            <div class="card">
                <label class="label">RGB → HEX</label>
                <div class="input-row triple">
                    <input type="number" id="rInput" class="input small" placeholder="R" min="0" max="255" />
                    <input type="number" id="gInput" class="input small" placeholder="G" min="0" max="255" />
                    <input type="number" id="bInput" class="input small" placeholder="B" min="0" max="255" />
                    <button class="btn" id="rgbBtn">Convert</button>
                </div>
                <div class="result" id="rgbResult"></div>
            </div>
        </section>

        <!-- COLOR PICKER (links both converters) -->
        <div class="card picker-card">
            <label class="label">Or pick a color</label>
            <input type="color" id="colorPicker" value="#4a90d9" />
            <span class="picker-hint">Tap to open color picker</span>
        </div>

        <!-- SCHEME GENERATOR SECTION -->
        <section class="section">
            <h2 class="section-title">Scheme Generator</h2>
            <div class="card">
                <label class="label">Seed Color (HEX)</label>
                <input
                    type="text"
                    id="schemeHexInput"
                    class="input"
                    placeholder="#1a2b3c"
                    maxlength="7"
                />

                <label class="label" style="margin-top: 16px;">Mode</label>
                <select id="schemeMode" class="input select">
                    <option value="monochrome">Monochrome</option>
                    <option value="monochrome-dark">Monochrome Dark</option>
                    <option value="monochrome-light">Monochrome Light</option>
                    <option value="analogic" selected>Analogic</option>
                    <option value="complement">Complement</option>
                    <option value="analogic-complement">Analogic Complement</option>
                    <option value="triad">Triad</option>
                    <option value="quad">Quad</option>
                </select>

                <button class="btn full" id="schemeBtn">Generate Scheme</button>
            </div>

            <!-- SCHEME RESULT -->
            <div id="schemeResult" class="scheme-grid"></div>
        </section>

        <!-- LOADER -->
        <div class="loader" id="loader">
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
        </div>

        <!-- ERROR MESSAGE -->
        <div class="error-msg" id="errorMsg"></div>

    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
